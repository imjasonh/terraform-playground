[package]
name = "fc-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Example Firecracker runner using on-demand OCI image rootfs via virtio-fs"

[[bin]]
name = "fc-runner"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
fc-oci-fs = { path = "../fc-oci-fs" }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
fc-vhostfsd = { path = "../fc-vhostfsd" }
fuse-backend-rs = { workspace = true, default-features = false, features = ["virtiofs"] }
reqwest = { workspace = true, features = ["blocking"] }
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
vhost = { workspace = true, features = ["vhost-user-frontend"] }
vhost-user-backend.workspace = true
nix = { version = "0.30", features = ["fs"] }
vm-memory.workspace = true
